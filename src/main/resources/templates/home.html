<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout/head :: head('Alojamientos Exclusivos')}">
  <meta charset="UTF-8" />
  <title>Alojamientos Exclusivos | AlohaRent</title>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Cabecera Global con Buscador Integrado -->
  <div th:replace="~{fragments/layout/header :: navbar}"></div>

  <main class="flex-grow">
    
    <!-- Banner de bienvenida cuando el usuario ha iniciado sesión -->
    <div th:replace="~{fragments/components/banner :: welcome-banner}"></div>

    <!-- Hero Section con Buscador Principal Destacado (Estilo Airbnb) -->
    <section class="relative overflow-hidden bg-gradient-to-b from-sky-50/70 via-emerald-50/40 to-slate-50 py-12 md:py-16 border-b border-slate-200/60">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-semibold uppercase tracking-wider mb-4">
          <svg class="w-4 h-4 text-emerald-600" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
          AlohaRent Experiencias
        </span>

        <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold tracking-tight text-slate-900 mb-4">
          Encuentra tu próximo hogar con <br/>
          <span class="bg-gradient-to-r from-emerald-600 via-teal-600 to-sky-600 bg-clip-text text-transparent">
            AlohaRent
          </span>
        </h1>
        
        <p class="max-w-2xl mx-auto text-base sm:text-lg text-slate-600 mb-10">
          Reserva casas enteras, apartamentos céntricos y villas vacacionales con la máxima garantía y confort.
        </p>

        <!-- Buscador Principal Prominente (Estilo Barra Expandida Airbnb) -->
        <div class="max-w-4xl mx-auto bg-white rounded-3xl md:rounded-full p-2.5 sm:p-3 shadow-xl shadow-slate-200/80 border border-slate-200 hover:shadow-2xl transition-all">
          <form action="/search" method="GET" class="grid grid-cols-1 md:grid-cols-4 divide-y md:divide-y-0 md:divide-x divide-slate-100 items-center">
            
            <!-- Campo Destino -->
            <div class="px-5 py-3 text-left hover:bg-slate-50 rounded-2xl md:rounded-full transition-colors cursor-pointer group">
              <label for="main-destination" class="block text-xs font-bold uppercase tracking-wider text-slate-500 group-hover:text-emerald-700">
                Destino
              </label>
              <input 
                id="main-destination" 
                name="destination" 
                type="text" 
                th:value="${destination}"
                placeholder="¿A dónde quieres ir?" 
                class="w-full bg-transparent text-sm font-semibold text-slate-800 placeholder-slate-400 focus:outline-none"
              />
            </div>

            <!-- Campo Fechas de Entrada -->
            <div class="px-5 py-3 text-left hover:bg-slate-50 rounded-2xl md:rounded-full transition-colors cursor-pointer group">
              <label for="main-checkin" class="block text-xs font-bold uppercase tracking-wider text-slate-500 group-hover:text-sky-700">
                Llegada
              </label>
              <input 
                id="main-checkin" 
                name="checkin" 
                type="date" 
                th:value="${checkin}"
                class="w-full bg-transparent text-sm font-semibold text-slate-700 focus:outline-none"
              />
            </div>

            <!-- Campo Fechas de Salida -->
            <div class="px-5 py-3 text-left hover:bg-slate-50 rounded-2xl md:rounded-full transition-colors cursor-pointer group">
              <label for="main-checkout" class="block text-xs font-bold uppercase tracking-wider text-slate-500 group-hover:text-sky-700">
                Salida
              </label>
              <input 
                id="main-checkout" 
                name="checkout" 
                type="date" 
                th:value="${checkout}"
                class="w-full bg-transparent text-sm font-semibold text-slate-700 focus:outline-none"
              />
            </div>

            <!-- Campo Huéspedes y Botón de Búsqueda -->
            <div class="px-4 py-3 flex items-center justify-between text-left hover:bg-slate-50 rounded-2xl md:rounded-full transition-colors group">
              <div class="flex-grow pr-2">
                <label for="main-guests" class="block text-xs font-bold uppercase tracking-wider text-slate-500 group-hover:text-emerald-700">
                  Viajeros
                </label>
                <select id="main-guests" name="guests" class="w-full bg-transparent text-sm font-semibold text-slate-700 focus:outline-none cursor-pointer">
                  <option value="" th:selected="${guests == null}">Cualquiera</option>
                  <option value="1" th:selected="${guests == 1}">1 Huésped</option>
                  <option value="2" th:selected="${guests == 2}">2 Huéspedes</option>
                  <option value="3" th:selected="${guests == 3}">3 Huéspedes</option>
                  <option value="4" th:selected="${guests == 4}">4 Huéspedes</option>
                  <option value="5" th:selected="${guests == 5}">5 Huéspedes</option>
                  <option value="6" th:selected="${guests != null and guests >= 6}">6+ Huéspedes</option>
                </select>
              </div>

              <button 
                type="submit" 
                class="flex items-center justify-center gap-2 px-6 py-3.5 bg-gradient-to-r from-emerald-500 to-sky-600 hover:from-emerald-600 hover:to-sky-700 text-white font-bold rounded-full shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/40 transition-all transform active:scale-95"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <span class="text-sm">Buscar</span>
              </button>
            </div>

          </form>
        </div>

        <!-- Alerta de validación en caso de filtros inválidos -->
        <div th:if="${searchError != null}" class="max-w-4xl mx-auto mt-4 px-5 py-3 rounded-2xl bg-amber-50 border border-amber-200 text-amber-900 flex items-center gap-3 shadow-sm text-left">
          <svg class="w-5 h-5 text-amber-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span class="text-sm font-semibold" th:text="${searchError}">Error en la búsqueda</span>
        </div>

      </div>
    </section>

    <!-- Catálogo de Alojamientos -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      
      <!-- Si la lista está vacía, mostramos el mensaje de que no hay alojamientos -->
      <div th:if="${inmuebles.empty}" class="text-center py-16 px-4 bg-white rounded-3xl border border-slate-200/80 shadow-sm max-w-xl mx-auto">
        <!-- ... (Aquí dejas el SVG y los textos de "No hay alojamientos" que ya tenías) ... -->
        <h2 class="text-xl font-bold text-slate-900 mb-2">No hay alojamientos disponibles</h2>
      </div>

      <!-- Si hay alojamientos, creamos un grid dinámico -->
      <div th:unless="${inmuebles.empty}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        
        <!-- Bucle de Thymeleaf: Crea una tarjeta por cada inmueble en la base de datos -->
        <div th:each="prop : ${inmuebles}" class="bg-white rounded-2xl overflow-hidden shadow-md border border-slate-100 hover:shadow-lg transition-shadow flex flex-col">
          <!-- Imagen de cabecera -->
          <div class="relative h-48 overflow-hidden bg-slate-100">
            <a th:href="@{'/properties/' + ${prop.id}}">
              <img 
                th:src="${prop.imageUrl != null and !#strings.isEmpty(prop.imageUrl) ? prop.imageUrl : 'https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=800&q=80'}" 
                th:alt="${prop.address}" 
                class="w-full h-full object-cover hover:scale-105 transition-transform duration-500" 
              />
            </a>
            <span class="absolute top-3 left-3 bg-white/95 backdrop-blur-md text-slate-800 text-[11px] font-bold px-2.5 py-1 rounded-lg shadow-sm" th:text="${prop.type}">Tipo</span>
          </div>

          <div class="p-6 flex-grow flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-4">
                <a th:href="@{'/properties/' + ${prop.id}}" class="hover:underline">
                  <h3 class="text-lg font-bold text-slate-900" th:text="${prop.address}">Dirección</h3>
                </a>
              </div>
              <p class="text-slate-600 mb-2">
                <span class="font-semibold">Destino:</span> <span th:text="${prop.destination}">Ciudad</span>
              </p>
              <p class="text-slate-600 mb-4">
                <span class="font-semibold">Capacidad:</span> <span th:text="${prop.capacity} + ' huéspedes'"></span>
              </p>
            </div>
            <div class="border-t border-slate-100 pt-4 flex justify-between items-center">
              <div class="flex items-baseline gap-1">
                <span class="text-xl font-extrabold text-emerald-600" th:text="${prop.pricePerNight} + ' €'">0.0 €</span>
                <span class="text-xs text-slate-400 font-medium">/ noche</span>
              </div>
              <a th:href="@{'/properties/' + ${prop.id}}" class="inline-flex items-center gap-1 px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-sky-600 hover:from-emerald-700 hover:to-sky-700 text-white font-bold text-xs shadow-md shadow-emerald-600/20 hover:shadow-lg transition-all">
                <span>Ver y Reservar</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
              </a>
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- Pie de Página Global -->
  <footer th:replace="~{fragments/layout/footer :: footer}"></footer>

</body>
</html>
