<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Rental Platform</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f6f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: bold; }
        input { width: 100%; padding: 0.5rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 0.7rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        .alert-error { color: #721c24; background-color: #f8d7da; padding: 0.5rem; border-radius: 4px; margin-bottom: 1rem; }
        .alert-success { color: #155724; background-color: #d4edda; padding: 0.5rem; border-radius: 4px; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="card">
    <h2>Iniciar Sesión</h2>

    <div th:if="${param.registered}" class="alert-success">
        ¡Registro completado! Ya puedes iniciar sesión.
    </div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required />
        </div>
        <button type="submit">Entrar</button>
    </form>

    <p style="text-align: center; margin-top: 1rem;">
        ¿No tienes cuenta? <a th:href="@{/register}">Regístrate aquí</a>
    </p>
</div>
</body>
</html>
