<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- Header global con buscador visible en todas las pestañas -->
  <header th:fragment="navbar" class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-100 shadow-sm transition-all duration-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20 gap-4">
        
        <!-- Logo de marca AlohaRent -->
        <a href="/" class="flex items-center gap-2.5 flex-shrink-0 group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-sky-600 flex items-center justify-center text-white shadow-md shadow-emerald-500/20 group-hover:scale-105 transition-transform duration-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
          </div>
          <span class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-600 to-sky-600 bg-clip-text text-transparent">
            AlohaRent
          </span>
        </a>

        <!-- Buscador Global visible en todas las páginas -->
        <div class="flex-1 max-w-xl mx-2 sm:mx-6">
          <form action="/" method="GET" class="relative flex items-center bg-slate-50 border border-slate-200 rounded-full shadow-inner hover:border-emerald-400 focus-within:border-sky-500 focus-within:ring-2 focus-within:ring-sky-100 transition-all">
            <div class="flex items-center pl-4 text-slate-400">
              <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </div>
            <input 
              type="text" 
              name="q" 
              placeholder="Buscar por destino, ciudad o tipo de alojamiento..." 
              class="w-full py-2.5 px-3 bg-transparent text-sm text-slate-800 placeholder-slate-400 focus:outline-none"
            />
            <button 
              type="submit" 
              class="m-1 px-4 py-2 bg-gradient-to-r from-emerald-500 to-sky-600 hover:from-emerald-600 hover:to-sky-700 text-white text-xs font-semibold rounded-full shadow-sm hover:shadow transition-all flex items-center gap-1.5 flex-shrink-0"
            >
              <span>Buscar</span>
            </button>
          </form>
        </div>

        <!-- Menú de Usuario / Sesión dinámica -->
        <nav class="flex items-center gap-3 flex-shrink-0">
          <a href="/" class="hidden md:inline-flex text-sm font-medium text-slate-600 hover:text-emerald-600 transition-colors px-3 py-2 rounded-lg hover:bg-slate-50">
            Alojamientos
          </a>

          <!-- Usuario NO autenticado -->
          <th:block th:if="${session.loggedUser == null}">
            <a href="/login" class="text-sm font-semibold text-slate-700 hover:text-sky-600 px-3.5 py-2 rounded-lg hover:bg-slate-50 transition-colors">
              Iniciar sesión
            </a>
            <a href="/register" class="inline-flex items-center justify-center text-sm font-semibold text-white bg-gradient-to-r from-emerald-600 to-sky-600 hover:from-emerald-700 hover:to-sky-700 px-4 py-2 rounded-xl shadow-md shadow-sky-600/15 hover:shadow-lg transition-all">
              Registrarse
            </a>
          </th:block>

          <!-- Usuario autenticado -->
          <th:block th:if="${session.loggedUser != null}">
            <a href="/profile" class="text-xs font-semibold text-sky-700 bg-sky-50 hover:bg-sky-100 px-3 py-1.5 rounded-lg border border-sky-200 transition-colors">
              Mi Perfil
            </a>
              <div th:if="${session.loggedUser.role == 'LANDLORD'}">
                <a th:href="@{/inmuebles/alta}" class="text-sm font-semibold text-slate-700 hover:text-emerald-600 transition-colors">
                  Publicar Inmueble
                </a>
              </div>
            <div class="flex items-center gap-2.5 pl-1">
              <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 font-bold text-xs flex items-center justify-center border border-emerald-300">
                <span th:text="${#strings.substring(session.loggedUser.name, 0, 1)}">U</span>
              </div>
              <div class="hidden sm:flex flex-col text-left">
                <span class="text-xs font-bold text-slate-800 leading-tight" th:text="${session.loggedUser.name}">Usuario</span>
                <span class="text-[10px] font-semibold text-emerald-600 uppercase" th:text="${session.loggedUser.role == 'LANDLORD' ? 'Propietario' : 'Inquilino'}">Inquilino</span>
              </div>
              <a href="/logout" class="ml-1 text-xs font-semibold text-slate-500 hover:text-red-600 px-2.5 py-1.5 rounded-lg border border-slate-200 hover:border-red-200 hover:bg-red-50 transition-colors">
                Cerrar sesión
              </a>
            </div>
          </th:block>

        </nav>

      </div>
    </div>
  </header>
</body>
</html>
