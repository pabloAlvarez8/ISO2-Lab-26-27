<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout/head :: head('Registrar Inmueble')}">
  <meta charset="UTF-8" />
  <title>Registrar Inmueble | AlohaRent</title>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Cabecera Global con Buscador Integrado -->
  <div th:replace="~{fragments/layout/header :: navbar}"></div>

  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl w-full bg-white rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200/70 border border-slate-100">
      
      <!-- Encabezado de la tarjeta -->
      <div class="text-center mb-8">
        <div class="inline-flex w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-sky-600 items-center justify-center text-white shadow-md shadow-emerald-500/25 mb-4">
          <!-- Icono de una casa -->
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Registrar nuevo inmueble</h1>
        <p class="text-sm text-slate-500 mt-1.5">Completa los datos para publicar tu alojamiento en AlohaRent</p>
      </div>

      <!-- Alerta de error si ya existe -->
      <div th:if="${error}" class="mb-5 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-2">
        <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <span th:text="${error}">Error al registrar.</span>
      </div>
      
      <!-- Formulario de alta de inmueble -->
      <form th:action="@{/inmuebles/alta}" method="post" class="space-y-5">
        
        <!-- Dirección (Fila completa) -->
        <div>
          <label for="address" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
            Dirección del inmueble
          </label>
          <input 
            id="address" 
            name="address" 
            type="text" 
            required 
            placeholder="Ej: Calle Gran Vía 45, 3ºB"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-all"
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Destino / Ciudad -->
          <div>
            <label for="destination" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Destino / Ciudad
            </label>
            <input 
              id="destination" 
              name="destination" 
              type="text" 
              required 
              placeholder="Ej: Madrid"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-all"
            />
          </div>

          <!-- Tipo de Inmueble -->
          <div>
            <label for="type" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Tipo de alojamiento
            </label>
            <select 
              id="type" 
              name="type" 
              required
              class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-all cursor-pointer"
            >
              <option value="" disabled selected>Selecciona un tipo...</option>
              <option value="Vivienda completa">Vivienda completa</option>
              <option value="Habitación individual">Habitación individual</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Capacidad -->
          <div>
            <label for="capacity" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Capacidad (Huéspedes)
            </label>
            <input 
              id="capacity" 
              name="capacity" 
              type="number" 
              min="1"
              required 
              placeholder="Ej: 4"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-all"
            />
          </div>

          <!-- Precio por noche -->
          <div>
            <label for="pricePerNight" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Precio por noche (€)
            </label>
            <input 
              id="pricePerNight" 
              name="pricePerNight" 
              type="number" 
              step="0.01"
              min="0"
              required 
              placeholder="Ej: 75.50"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100 transition-all"
            />
          </div>

          <!-- Opción de Reserva Inmediata -->
          <div class="flex items-center gap-3 p-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-white transition-colors cursor-pointer">
            <input 
                id="directBooking" 
                name="directBooking" 
                type="checkbox" 
                value="true"
                class="w-5 h-5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer"
            />
            <div>
                <label for="directBooking" class="block text-sm font-bold text-slate-900 cursor-pointer">
                Permitir reserva inmediata
                </label>
                <p class="text-xs text-slate-500">
                Los inquilinos podrán completar la reserva y el pago directamente sin esperar tu confirmación manual.
                </p>
            </div>
          </div>

        <div class="pt-4">
          <button 
            type="submit" 
            class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-600 via-teal-600 to-sky-600 hover:from-emerald-700 hover:to-sky-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-sky-600/20 hover:shadow-sky-600/30 transition-all transform active:scale-[0.98]"
          >
            Publicar Inmueble
          </button>
        </div>
      </form>

    </div>
  </main>

  <!-- Pie de Página Global -->
  <footer th:replace="~{fragments/layout/footer :: footer}"></footer>

</body>
</html>
