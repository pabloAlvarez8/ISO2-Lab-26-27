spring.application.name=rental-platform

# Base de datos en memoria H2 para entorno de tests
spring.datasource.url=jdbc:h2:mem:rentaldb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desactivar scripts de inicializacion SQL en tests para aislamiento
spring.sql.init.mode=never
